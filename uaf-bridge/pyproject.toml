[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uaf-bridge"
version = "0.1.0"
description = "Prototype bridge from static UAF warnings to SMT witness plans and syz-style scaffolds"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jsonschema>=4.23.0",
  "z3-solver>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[tool.setuptools]
packages = [
  "common",
  "extractor",
  "mapping",
  "mock_adapter",
  "proof",
  "runtime",
  "smt",
  "uafx_fork",
  "uafx_fork.tools",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
